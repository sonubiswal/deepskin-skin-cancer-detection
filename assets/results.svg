<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Test accuracy by model</title>
  <desc id="d">Bar chart of HAM10000 test accuracy and training time: Custom CNN 75.3 percent in 431.6 minutes, MobileNetV2 76.3 percent in 31.6 minutes, DenseNet121 76.6 percent in 169.1 minutes. The axis starts at 70 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1f28"/><stop offset="1" stop-color="#0a1c26"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="354" width="1280" height="6" fill="#2dd4bf" fill-opacity="0.5"/>
  <text x="60" y="56" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="700" fill="#ffffff">Test accuracy by model</text>
  <text x="60" y="84" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="#6f959f">HAM10000 test split, seven classes. Axis starts at 70% to make the gaps readable.</text>
  <text x="1220" y="106" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#6f959f">Training time</text>
  <line x1="260.0" y1="116" x2="260.0" y2="300" stroke="#5eead4" stroke-opacity="0.15"/>
  <text x="260.0" y="322" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#6f959f">70%</text>
  <line x1="435.0" y1="116" x2="435.0" y2="300" stroke="#5eead4" stroke-opacity="0.15"/>
  <text x="435.0" y="322" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#6f959f">72%</text>
  <line x1="610.0" y1="116" x2="610.0" y2="300" stroke="#5eead4" stroke-opacity="0.15"/>
  <text x="610.0" y="322" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#6f959f">74%</text>
  <line x1="785.0" y1="116" x2="785.0" y2="300" stroke="#5eead4" stroke-opacity="0.15"/>
  <text x="785.0" y="322" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#6f959f">76%</text>
  <line x1="960.0" y1="116" x2="960.0" y2="300" stroke="#5eead4" stroke-opacity="0.15"/>
  <text x="960.0" y="322" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#6f959f">78%</text>
  <text x="242" y="149" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="500" fill="#a9c7cf">Custom CNN</text>
  <rect x="260" y="130" width="0" height="28" rx="6" fill="#3a6b75">
    <animate attributeName="width" from="0" to="463.7499999999998" dur="1.1s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
  </rect>
  <text x="735.7499999999998" y="149" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#a9c7cf" opacity="0">75.3%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/></text>
  <text x="1220" y="149" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#a9c7cf" opacity="0">431.6 min
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.2s" fill="freeze"/></text>
  <text x="242" y="205" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="500" fill="#a9c7cf">MobileNetV2</text>
  <rect x="260" y="186" width="0" height="28" rx="6" fill="#3a6b75">
    <animate attributeName="width" from="0" to="551.2499999999998" dur="1.1s" begin="0.55s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
  </rect>
  <text x="823.2499999999998" y="205" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#a9c7cf" opacity="0">76.3%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4500000000000002s" fill="freeze"/></text>
  <text x="1220" y="205" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#5eead4" opacity="0">31.6 min
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.4500000000000002s" fill="freeze"/></text>
  <text x="1220" y="222" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#5eead4" opacity="0">fastest, 13x quicker than Custom CNN
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.6500000000000001s" fill="freeze"/></text>
  <text x="242" y="261" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">DenseNet121</text>
  <rect x="260" y="242" width="0" height="28" rx="6" fill="url(#win)">
    <animate attributeName="width" from="0" to="577.4999999999995" dur="1.1s" begin="0.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
  </rect>
  <text x="849.4999999999995" y="261" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#99f6e4" opacity="0">76.6%
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7000000000000002s" fill="freeze"/></text>
  <text x="1220" y="261" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#a9c7cf" opacity="0">169.1 min
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7000000000000002s" fill="freeze"/></text>
  <g opacity="0">
    <rect x="919.4999999999995" y="244" width="118" height="24" rx="12" fill="#2dd4bf" fill-opacity="0.15" stroke="#2dd4bf"/>
    <text x="978.4999999999995" y="261" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#99f6e4">selected model</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.2s" fill="freeze"/>
  </g>
</svg>
