<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How DeepSkin reads a lesion</title>
  <desc id="d">A dermatoscopic image passes through DenseNet121 dense blocks and a softmax layer, producing confidence bars for the seven lesion classes. The predictions shown are illustrative.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1f28"/><stop offset="1" stop-color="#0a1c26"/></linearGradient>
    <pattern id="gm" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#5eead4" stroke-opacity="0.06"/></pattern>
    <radialGradient id="skin" cx="0.42" cy="0.38" r="0.75"><stop offset="0" stop-color="#f6d3bb"/><stop offset="0.6" stop-color="#e2a98c"/><stop offset="1" stop-color="#c58468"/></radialGradient>
    <radialGradient id="lesion" cx="0.45" cy="0.45" r="0.65"><stop offset="0" stop-color="#2b1511"/><stop offset="0.55" stop-color="#5a3022"/><stop offset="1" stop-color="#8a553c"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset="1" stop-color="#5eead4" stop-opacity="0.5"/></linearGradient>
    <clipPath id="tile"><rect x="60" y="130" width="200" height="200" rx="18"/></clipPath>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker>
  </defs>
  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#gm)"/>
  <rect x="0" y="434" width="1280" height="6" fill="#2dd4bf" fill-opacity="0.5"/>

  <text x="60" y="64" font-family="Georgia,'Times New Roman',serif" font-size="32" font-weight="700" fill="#ffffff">How DeepSkin reads a lesion</text>
  <text x="60" y="92" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#6f959f">From pixels to seven class probabilities in one forward pass</text>

  <!-- input tile -->
  <rect x="60" y="130" width="200" height="200" rx="18" fill="url(#skin)"/>
  <g clip-path="url(#tile)">
    <g transform="translate(-850 10)">
      <path d="M972 204 C978 172 1022 164 1044 184 C1068 198 1064 236 1048 250 C1032 274 992 276 976 254 C960 240 964 222 972 204 Z" fill="url(#lesion)"/>
      <ellipse cx="1008" cy="222" rx="22" ry="17" fill="#1c0d0a" opacity="0.8"/>
      <g fill="#3a1d15" opacity="0.85"><circle cx="1068" cy="212" r="3.2"/><circle cx="958" cy="236" r="2.6"/></g>
    </g>
    <g>
      <rect x="60" y="-60" width="200" height="60" fill="url(#scan)"/>
      <rect x="60" y="-1" width="200" height="2" fill="#99f6e4"/>
      <animateTransform attributeName="transform" type="translate" values="0 130;0 330;0 130" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="60" y="130" width="200" height="200" rx="18" fill="none" stroke="#5eead4" stroke-opacity="0.8" stroke-width="1.5"/>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a9c7cf" text-anchor="middle">
    <text x="160" y="358">Dermatoscopic image</text>
    <text x="500" y="358">DenseNet121 dense blocks</text>
    <text x="500" y="378" font-size="12" fill="#6f959f">ImageNet transfer learning</text>
    <text x="715" y="358">Softmax</text>
  </g>

  <line x1="268" y1="230" x2="336" y2="230" stroke="#5eead4" stroke-width="1.5" marker-end="url(#ah)"/>
  <g>
    <rect x="362" y="128.0" width="56" height="180" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <rect x="356" y="134.0" width="56" height="180" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <rect x="350" y="140.0" width="56" height="180" rx="8" fill="#10404a" stroke="#5eead4" stroke-opacity="0.9"/>
    <text x="378" y="234" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#99f6e4">D1</text>
  </g>
  <line x1="418" y1="230" x2="428" y2="230" stroke="#5eead4" stroke-opacity="0.6" stroke-dasharray="3 4"/>
  <g>
    <rect x="442" y="143.0" width="56" height="150" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <rect x="436" y="149.0" width="56" height="150" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <rect x="430" y="155.0" width="56" height="150" rx="8" fill="#10404a" stroke="#5eead4" stroke-opacity="0.9"/>
    <text x="458" y="234" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#99f6e4">D2</text>
  </g>
  <line x1="498" y1="230" x2="508" y2="230" stroke="#5eead4" stroke-opacity="0.6" stroke-dasharray="3 4"/>
  <g>
    <rect x="522" y="158.0" width="56" height="120" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <rect x="516" y="164.0" width="56" height="120" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <rect x="510" y="170.0" width="56" height="120" rx="8" fill="#10404a" stroke="#5eead4" stroke-opacity="0.9"/>
    <text x="538" y="234" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#99f6e4">D3</text>
  </g>
  <line x1="578" y1="230" x2="588" y2="230" stroke="#5eead4" stroke-opacity="0.6" stroke-dasharray="3 4"/>
  <g>
    <rect x="602" y="173.0" width="56" height="90" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <rect x="596" y="179.0" width="56" height="90" rx="8" fill="#0c2c35" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <rect x="590" y="185.0" width="56" height="90" rx="8" fill="#10404a" stroke="#5eead4" stroke-opacity="0.9"/>
    <text x="618" y="234" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="11" fill="#99f6e4">D4</text>
  </g>

  <line x1="664" y1="230" x2="676" y2="230" stroke="#5eead4" stroke-width="1.5"/>
  <rect x="680" y="205" width="70" height="50" rx="12" fill="#10404a" stroke="#5eead4" stroke-opacity="0.9"/>
  <text x="715" y="235" text-anchor="middle" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#99f6e4">7-way</text>

  <!-- fan-out -->
  <g fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1">
  <path d="M750 230 C800 230 805 140 850 140"/>
  <path d="M750 230 C800 230 805 178 850 178"/>
  <path d="M750 230 C800 230 805 216 850 216"/>
  <path d="M750 230 C800 230 805 254 850 254"/>
  <path d="M750 230 C800 230 805 292 850 292"/>
  <path d="M750 230 C800 230 805 330 850 330"/>
  <path d="M750 230 C800 230 805 368 850 368"/>
  </g>

  <!-- data packets -->
  <circle cy="230" r="4.5" fill="#99f6e4">
    <animate attributeName="cx" values="270;670" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="230" r="4.5" fill="#99f6e4">
    <animate attributeName="cx" values="270;670" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
  </circle>

  <!-- bars -->
  <text x="860" y="144.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">akiec</text>
  <rect x="876" y="131" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="131" width="9.0" height="18" rx="9" fill="#fbbf24">
    <animate attributeName="width" values="9.0;9.0;12.0;12.0;18.0;18.0;9.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>
  <text x="860" y="182.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">bcc</text>
  <rect x="876" y="169" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="169" width="6.0" height="18" rx="9" fill="#fb7185">
    <animate attributeName="width" values="6.0;6.0;30.0;30.0;228.0;228.0;6.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>
  <text x="860" y="220.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">bkl</text>
  <rect x="876" y="207" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="207" width="24.0" height="18" rx="9" fill="#2dd4bf">
    <animate attributeName="width" values="24.0;24.0;15.0;15.0;15.0;15.0;24.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>
  <text x="860" y="258.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">df</text>
  <rect x="876" y="245" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="245" width="3.0" height="18" rx="9" fill="#2dd4bf">
    <animate attributeName="width" values="3.0;3.0;3.0;3.0;6.0;6.0;3.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>
  <text x="860" y="296.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">mel</text>
  <rect x="876" y="283" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="283" width="12.0" height="18" rx="9" fill="#fb7185">
    <animate attributeName="width" values="12.0;12.0;222.0;222.0;18.0;18.0;12.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>
  <text x="860" y="334.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">nv</text>
  <rect x="876" y="321" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="321" width="240.0" height="18" rx="9" fill="#2dd4bf">
    <animate attributeName="width" values="240.0;240.0;12.0;12.0;9.0;9.0;240.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>
  <text x="860" y="372.5" text-anchor="end" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14" font-weight="600" fill="#cfe9ee">vasc</text>
  <rect x="876" y="359" width="300" height="18" rx="9" fill="#5eead4" fill-opacity="0.08"/>
  <rect x="876" y="359" width="6.0" height="18" rx="9" fill="#2dd4bf">
    <animate attributeName="width" values="6.0;6.0;6.0;6.0;6.0;6.0;6.0" keyTimes="0;0.28;0.38;0.61;0.71;0.94;1" dur="12s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1;0 0 1 1;.4 0 .2 1"/>
  </rect>

  <!-- cycling captions -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600">
    <text x="876" y="412" fill="#99f6e4" opacity="1">Top class: nv (benign)
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.31;0.34;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="876" y="412" fill="#fecdd3" opacity="0">Top class: mel (malignant)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.34;0.64;0.67;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="876" y="412" fill="#fecdd3" opacity="0">Top class: bcc (malignant)
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.64;0.67;1" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="1220" y="412" text-anchor="end" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#6f959f">illustrative output</text>
</svg>
